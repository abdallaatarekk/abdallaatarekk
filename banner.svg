<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Abdallah Tarek, Data Analyst and BI Developer</title>
  <desc id="d">Animated data pipeline: sources flow through Bronze, Silver and Gold into dashboards</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#0E2A2F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE08A"/><stop offset="1" stop-color="#E9A82B"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F5F9"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8B48A"/><stop offset="1" stop-color="#B5703A"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".35"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1B2B3A" stroke-width="1"/></pattern>
    <path id="p1" d="M470 160 H610"/>
    <path id="p2" d="M690 160 H830"/>
    <path id="p3" d="M910 160 H1050"/>
  </defs>
  <style>
    .name{font:800 46px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F8FAFC;letter-spacing:-1px}
    .role{font:600 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#2DD4BF}
    .tag{font:400 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94A3B8}
    .lbl{font:700 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220;text-anchor:middle}
    .cap{font:500 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94A3B8;text-anchor:middle;letter-spacing:.08em}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
    @keyframes grow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  </style>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity=".55"/>
  <circle cx="880" cy="160" r="260" fill="url(#glow)" class="pulse"/>

  <!-- text -->
  <text x="60" y="118" class="name">Abdallah Tarek</text>
  <text x="62" y="158" class="role">Data Analyst · BI Developer</text>
  <text x="62" y="190" class="tag">SQL · Power BI · Python · Databricks · n8n</text>
  <text x="62" y="222" class="tag">Messy data in. Numbers you can trust out.<tspan class="blink" fill="#2DD4BF">_</tspan></text>

  <g transform="translate(46 0)">
  <!-- sources -->
  <g>
    <circle cx="420" cy="100" r="7" fill="#64748B"/><circle cx="440" cy="130" r="7" fill="#64748B"/><circle cx="430" cy="160" r="7" fill="#64748B"/>
    <circle cx="440" cy="190" r="7" fill="#64748B"/><circle cx="420" cy="220" r="7" fill="#64748B"/>
    <text x="430" y="262" class="cap">SOURCES</text>
  </g>
  <path d="M447 130 L470 160 M437 160 H470 M447 190 L470 160" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- connectors -->
  <path d="M470 160 H610" stroke="#2DD4BF" stroke-width="2" fill="none" class="dash"/>
  <path d="M690 160 H830" stroke="#2DD4BF" stroke-width="2" fill="none" class="dash"/>
  <path d="M910 160 H1050" stroke="#2DD4BF" stroke-width="2" fill="none" class="dash"/>

  <!-- nodes -->
  <g>
    <rect x="610" y="120" width="80" height="80" rx="16" fill="url(#bronze)"/>
    <text x="650" y="166" class="lbl">Bronze</text>
    <text x="650" y="262" class="cap">RAW</text>
    <rect x="830" y="120" width="80" height="80" rx="16" fill="url(#silver)"/>
    <text x="870" y="166" class="lbl">Silver</text>
    <text x="870" y="262" class="cap">CLEAN</text>
    <rect x="1050" y="120" width="80" height="80" rx="16" fill="url(#gold)"/>
    <text x="1090" y="166" class="lbl">Gold</text>
    <text x="1090" y="262" class="cap">MODEL</text>
  </g>

  <!-- dashboard mini bars above gold -->
  <g transform="translate(1058 60)" >
    <rect class="bar" x="0" y="0" width="12" height="44" rx="3" fill="#2DD4BF" style="animation-delay:0s"/>
    <rect class="bar" x="20" y="0" width="12" height="44" rx="3" fill="#38BDF8" style="animation-delay:.4s"/>
    <rect class="bar" x="40" y="0" width="12" height="44" rx="3" fill="#F5B942" style="animation-delay:.8s"/>
    <rect class="bar" x="60" y="0" width="12" height="44" rx="3" fill="#2DD4BF" style="animation-delay:1.2s"/>
  </g>

  <!-- moving packets -->
  <g fill="#F8FAFC">
    <circle r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="0s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.2s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin=".4s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin=".4s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.6s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin=".8s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin=".8s"><mpath href="#p3"/></animateMotion></circle>
    <circle r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="2s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="2s"><mpath href="#p3"/></animateMotion></circle>
  </g>
</g>
</svg>
